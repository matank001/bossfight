<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="172" viewBox="0 0 1100 172" role="img" aria-label="Static knowledge is saturated"><title>Static knowledge is saturated</title><rect width="1100" height="172" fill="#0d1117"/><text x="24.0" y="32.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#e6edf3" text-anchor="start" >Static knowledge is saturated</text><text x="24.0" y="52.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start" >Isolated textbook questions no longer separate frontier models.</text><line x1="24.0" x2="1076.0" y1="68.0" y2="68.0" stroke="#30363d" stroke-width="1"/><text x="24.0" y="118.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="28" font-weight="600" fill="#e6edf3" text-anchor="start" >100%</text><text x="24.0" y="140.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start" >accuracy on 25 quantitative decisions</text><text x="24.0" y="157.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#6e7681" text-anchor="start" >all models, three runs each</text><line x1="287.0" x2="287.0" y1="88.0" y2="156.0" stroke="#30363d" stroke-width="1"/><text x="303.0" y="118.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="28" font-weight="600" fill="#e6edf3" text-anchor="start" >0</text><text x="303.0" y="140.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start" >framing reversals</text><text x="303.0" y="157.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#6e7681" text-anchor="start" >gain vs. loss frame, five runs</text><line x1="550.0" x2="550.0" y1="88.0" y2="156.0" stroke="#30363d" stroke-width="1"/><text x="566.0" y="118.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="28" font-weight="600" fill="#e6edf3" text-anchor="start" >≤ 8%</text><text x="566.0" y="140.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start" >anchoring shift</text><text x="566.0" y="157.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#6e7681" text-anchor="start" >GPT 0% · Claude 2% · Gemini 6% · Grok 8%</text><line x1="813.0" x2="813.0" y1="88.0" y2="156.0" stroke="#30363d" stroke-width="1"/><text x="829.0" y="118.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="28" font-weight="600" fill="#e6edf3" text-anchor="start" >12 / 12</text><text x="829.0" y="140.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start" >simulation runs identified as a test</text><text x="829.0" y="157.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#6e7681" text-anchor="start" >self-reported confidence 0.97–1.00</text></svg>